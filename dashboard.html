<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Professor - TGDQ SENAI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen p-6">

  <div class="max-w-6xl mx-auto space-y-6">
    <header class="flex justify-between items-center bg-blue-900 text-white p-6 rounded-lg shadow-md">
      <div>
        <h1 class="text-2xl font-bold">📊 Painel do Professor — Entregas TGDQ</h1>
        <p class="text-blue-200 text-sm">Acompanhamento e Notas dos Alunos em Tempo Real</p>
      </div>
      <div class="flex items-center gap-3">
        <a href="index.html" class="bg-blue-800 hover:bg-blue-700 text-white px-3 py-1.5 rounded text-xs font-bold transition">📋 Ver Roteiro</a>
        <button onclick="logout()" class="bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded text-xs font-bold transition">Sair</button>
        <div id="totalEntregas" class="bg-blue-800 px-4 py-2 rounded text-lg font-bold">Total: 0</div>
      </div>
    </header>

    <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-100 border-b border-gray-200 text-xs font-semibold text-gray-600 uppercase">
              <th class="p-3">Horário</th>
              <th class="p-3">Aluno</th>
              <th class="p-3">RA / Turno</th>
              <th class="p-3">Faturamento / Bônus</th>
              <th class="p-3">Média Dias / Atrasos</th>
              <th class="p-3 text-center">Acertos</th>
              <th class="p-3 text-right">Nota Final</th>
            </tr>
          </thead>
          <tbody id="tabelaResultados" class="text-sm divide-y divide-gray-200">
            <tr><td colspan="7" class="p-4 text-center text-gray-500">Aguardando autorização...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const EMAIL_PROFESSOR_MESTRE = "ricardo.carvalho@sistemafiep.org.br";

    const firebaseConfig = {
      apiKey: "AIzaSyAlvnAZtBvfh9UomS6JDfnLwRfhX0oW66I",
      authDomain: "senai-tgdq-2026.firebaseapp.com",
      projectId: "senai-tgdq-2026",
      storageBucket: "senai-tgdq-2026.firebasestorage.app",
      messagingSenderId: "236131355651",
      appId: "1:236131355651:web:ae3921fef6939d06be1236"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    function logout() {
      auth.signOut().then(() => window.location.href = "login.html");
    }

    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        alert("Por favor, faça login para aceder ao painel.");
        window.location.href = "login.html";
        return;
      }

      try {
        const doc = await db.collection("usuarios").doc(user.uid).get();
        const dados = doc.exists ? doc.data() : {};
        
        if (user.email !== EMAIL_PROFESSOR_MESTRE && dados.perfil !== 'professor') {
          alert("Acesso exclusivo ao Professor da disciplina.");
          window.location.href = "index.html";
          return;
        }

        db.collection("entregas_tgdq").orderBy("dataEnvio", "desc")
          .onSnapshot((snapshot) => {
            const tabela = document.getElementById("tabelaResultados");
            document.getElementById("totalEntregas").innerText = `Total: ${snapshot.size}`;
            
            if (snapshot.empty) {
              tabela.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-gray-500">Nenhuma entrega registrada ainda.</td></tr>`;
              return;
            }

            let html = "";
            snapshot.forEach((doc) => {
              const d = doc.data();
              const hora = d.dataEnvio ? new Date(d.dataEnvio.toDate()).toLocaleTimeString('pt-BR') : 'Enviando...';
              const corNota = d.nota >= 7 ? 'text-green-600 font-bold' : 'text-red-600 font-bold';
              const fat = d.respFaturamento ? 'R$ ' + d.respFaturamento.toFixed(2) : '-';
              const bon = d.respTotalBonus ? 'R$ ' + d.respTotalBonus.toFixed(2) : '-';

              html += `
                <tr class="hover:bg-gray-50">
                  <td class="p-3 text-xs text-gray-500">${hora}</td>
                  <td class="p-3 font-semibold">${d.nome}</td>
                  <td class="p-3"><span class="font-mono text-xs">${d.ra}</span> <span class="bg-gray-200 px-1.5 py-0.5 rounded text-[10px] ml-1">${d.turno}</span></td>
                  <td class="p-3 text-xs">Fat: <b>${fat}</b><br>Bônus: <b>${bon}</b></td>
                  <td class="p-3 text-xs">Média: <b>${d.respMedia || '-'}</b>d<br>Atrasos: <b>${d.respAtrasos || '-'}</b></td>
                  <td class="p-3 text-center font-bold text-xs"><span class="bg-blue-100 text-blue-900 px-2 py-1 rounded">${d.acertos !== undefined ? d.acertos : 2}/5</span></td>
                  <td class="p-3 text-right ${corNota} text-base">${d.nota ? d.nota.toFixed(1) : '0.0'}</td>
                </tr>
              `;
            });
            tabela.innerHTML = html;
          });

      } catch (e) {
        console.error("Erro de permissão:", e);
      }
    });
  </script>
</body>
</html>
