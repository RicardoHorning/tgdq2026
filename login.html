<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TGDQ SENAI - Autenticação</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden">
    <div class="bg-blue-900 text-white p-6 text-center">
      <h1 class="text-2xl font-bold">Portal TGDQ — SENAI</h1>
      <p class="text-blue-200 text-xs mt-1">Tratamento e Gerenciamento de Dados Quantitativos</p>
    </div>

    <!-- Abas de Navegação -->
    <div class="flex border-b border-gray-200 bg-gray-50 text-sm font-semibold">
      <button id="tabLogin" onclick="mudarAba('login')" class="flex-1 py-3 text-blue-900 border-b-2 border-blue-900 bg-white">Entrar</button>
      <button id="tabCadastro" onclick="mudarAba('cadastro')" class="flex-1 py-3 text-gray-500 hover:text-blue-900">Criar Conta (1º Acesso)</button>
    </div>

    <div class="p-6">
      <!-- FORMULÁRIO DE LOGIN -->
      <form id="formLogin" onsubmit="realizarLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">E-mail Cadastrado:</label>
          <input type="email" id="loginEmail" required placeholder="aluno@senai.br" class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Senha:</label>
          <input type="password" id="loginSenha" required placeholder="••••••••" class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
        </div>
        <button type="submit" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-bold py-2.5 rounded-lg text-sm transition">Entrar no Sistema</button>
      </form>

      <!-- FORMULÁRIO DE CADASTRO -->
      <form id="formCadastro" onsubmit="realizarCadastro(event)" class="space-y-3 hidden">
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Nome Completo:</label>
          <input type="text" id="cadNome" required placeholder="Ex: Ricardo Horning Carvalho" class="w-full p-2 border rounded-lg text-sm">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">RA / Matrícula:</label>
            <input type="text" id="cadRA" required placeholder="Ex: 123456" class="w-full p-2 border rounded-lg text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Turno:</label>
            <select id="cadTurno" class="w-full p-2 border rounded-lg text-sm">
              <option value="T1">T1 - Manhã</option>
              <option value="T2">T2 - Tarde</option>
              <option value="T3">T3 - Noite</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">E-mail:</label>
          <input type="email" id="cadEmail" required placeholder="seu.email@exemplo.com" class="w-full p-2 border rounded-lg text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Criar Senha (mínimo 6 caracteres):</label>
          <input type="password" id="cadSenha" required minlength="6" placeholder="••••••••" class="w-full p-2 border rounded-lg text-sm">
        </div>
        <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded-lg text-sm transition">Cadastrar e Iniciar Atividade</button>
      </form>

      <div id="authMensagem" class="mt-4 text-xs text-center font-bold hidden p-2 rounded"></div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAlvnAZtBvfh9UomS6JDfnLwRfhX0oW66I",
      authDomain: "senai-tgdq-2026.firebaseapp.com",
      projectId: "senai-tgdq-2026",
      storageBucket: "senai-tgdq-2026.firebasestorage.app",
      messagingSenderId: "236131355651",
      appId: "1:236131355651:web:ae3921fef6939d06be1236"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    function mudarAba(aba) {
      const msg = document.getElementById('authMensagem');
      msg.classList.add('hidden');
      if (aba === 'login') {
        document.getElementById('formLogin').classList.remove('hidden');
        document.getElementById('formCadastro').classList.add('hidden');
        document.getElementById('tabLogin').className = "flex-1 py-3 text-blue-900 border-b-2 border-blue-900 bg-white";
        document.getElementById('tabCadastro').className = "flex-1 py-3 text-gray-500 hover:text-blue-900";
      } else {
        document.getElementById('formLogin').classList.add('hidden');
        document.getElementById('formCadastro').classList.remove('hidden');
        document.getElementById('tabCadastro').className = "flex-1 py-3 text-blue-900 border-b-2 border-blue-900 bg-white";
        document.getElementById('tabLogin').className = "flex-1 py-3 text-gray-500 hover:text-blue-900";
      }
    }

    function exibirMensagem(texto, erro = false) {
      const msg = document.getElementById('authMensagem');
      msg.innerText = texto;
      msg.className = `mt-4 text-xs text-center font-bold p-2 rounded block ${erro ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`;
    }

    async function realizarLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const senha = document.getElementById('loginSenha').value;

      try {
        await auth.signInWithEmailAndPassword(email, senha);
        window.location.href = "index.html";
      } catch (err) {
        exibirMensagem("Erro ao entrar: Verifique e-mail e senha.", true);
      }
    }

    async function realizarCadastro(e) {
      e.preventDefault();
      const nome = document.getElementById('cadNome').value.trim();
      const ra = document.getElementById('cadRA').value.trim();
      const turno = document.getElementById('cadTurno').value;
      const email = document.getElementById('cadEmail').value.trim();
      const senha = document.getElementById('cadSenha').value;

      try {
        exibirMensagem("Criando conta...");
        const credencial = await auth.createUserWithEmailAndPassword(email, senha);
        const user = credencial.user;

        await user.updateProfile({ displayName: nome });

        await db.collection("usuarios").doc(user.uid).set({
          nome: nome,
          ra: ra,
          turno: turno,
          email: email,
          criadoEm: firebase.firestore.FieldValue.serverTimestamp()
        });

        window.location.href = "index.html";
      } catch (err) {
        exibirMensagem("Erro no cadastro: " + err.message, true);
      }
    }
  </script>
</body>
</html>
